name: android-release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Candidate app version (MAJOR.MINOR.PATCH)'
        required: true
        type: string
      version_code:
        description: 'Optional Android versionCode; otherwise derived from semantic version / run number'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  APP_ENV: production
  EXPO_PUBLIC_API_ORIGIN: ${{ vars.DUALLANE_API_ORIGIN }}
  ANDROID_PACKAGE: com.timestarry.duallane

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm and Node
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/resolve-android-version.mjs

      - name: Validate release inputs
        env:
          KEYSTORE_B64: ${{ secrets.DUALLANE_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DUALLANE_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DUALLANE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DUALLANE_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$EXPO_PUBLIC_API_ORIGIN" ]]; then
            echo "EXPO_PUBLIC_API_ORIGIN=https://duallane.tsio.top" >> "$GITHUB_ENV"
          fi
          test -n "$KEYSTORE_B64" || { echo 'DUALLANE_ANDROID_KEYSTORE_BASE64 secret is required'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'DUALLANE_ANDROID_STORE_PASSWORD secret is required'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'DUALLANE_ANDROID_KEY_ALIAS secret is required'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'DUALLANE_ANDROID_KEY_PASSWORD secret is required'; exit 1; }

      - name: Decode Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.DUALLANE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/duallane-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/duallane-signing/release.keystore"
          test -s "$RUNNER_TEMP/duallane-signing/release.keystore"

      - name: Check TypeScript, lint, tests, and bundle Android assets
        run: |
          pnpm check
          pnpm sync:android
          pnpm build:icons

      - name: Ensure Android SDK 36 build-tools
        run: |
          sdkmgr="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$sdkmgr" --licenses >/dev/null || true
          "$sdkmgr" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed APK and AAB
        id: build_packages
        env:
          DUALLANE_ANDROID_KEYSTORE: ${{ runner.temp }}/duallane-signing/release.keystore
          DUALLANE_ANDROID_STORE_PASSWORD: ${{ secrets.DUALLANE_ANDROID_STORE_PASSWORD }}
          DUALLANE_ANDROID_KEY_ALIAS: ${{ secrets.DUALLANE_ANDROID_KEY_ALIAS }}
          DUALLANE_ANDROID_KEY_PASSWORD: ${{ secrets.DUALLANE_ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 assembleRelease bundleRelease

      - name: Verify packages and generate release metadata
        id: release_metadata
        timeout-minutes: 3
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$build_tools/aapt"
          test -x "$build_tools/apksigner"
          node scripts/create-android-release-manifest.mjs \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --output-dir artifacts/android-release \
            --aapt "$build_tools/aapt" --apksigner "$build_tools/apksigner"

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: duallane-android-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/android-release/*

      - name: Create complete draft GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              artifacts/android-release/app-release.apk \
              artifacts/android-release/app-release.aab \
              artifacts/android-release/build-provenance.json \
              artifacts/android-release/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/android-release/app-release.apk \
              artifacts/android-release/app-release.aab \
              artifacts/android-release/build-provenance.json \
              artifacts/android-release/SHA256SUMS \
              --draft --verify-tag --generate-notes
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest --verify-tag
          fi
