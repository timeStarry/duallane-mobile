name: android-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_ENV: test
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test plugins/*.test.cjs
      - run: pnpm build:android

      - name: Create disposable test signing identity
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/android-test.keystore" \
            -storepass android-test -keypass android-test -alias android-test \
            -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=DualLane CI Test'

      - name: Build debug and test-signed release packages
        working-directory: android
        env:
          DUALLANE_ANDROID_KEYSTORE: ${{ runner.temp }}/android-test.keystore
          DUALLANE_ANDROID_STORE_PASSWORD: android-test
          DUALLANE_ANDROID_KEY_ALIAS: android-test
          DUALLANE_ANDROID_KEY_PASSWORD: android-test
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            assembleDebug assembleRelease bundleRelease

      - name: Verify and collect test packages
        run: |
          mkdir -p artifacts/android-test
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/android-test/duallane-test-signed.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/android-test/duallane-test-signed.aab
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs artifacts/android-test/duallane-test-signed.apk > artifacts/android-test/apk-signature.txt
          jarsigner -J-Duser.language=en -verify -certs artifacts/android-test/duallane-test-signed.aab > artifacts/android-test/aab-signature.txt
          grep -F 'jar verified.' artifacts/android-test/aab-signature.txt
          apkanalyzer manifest print artifacts/android-test/duallane-test-signed.apk > artifacts/android-test/manifest.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/android-test/manifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          assert root.attrib['package'] == 'com.timestarry.duallane'
          assert app.attrib[android + 'allowBackup'] == 'false'
          assert app.attrib.get(android + 'debuggable', 'false') == 'false'
          assert app.attrib.get(android + 'usesCleartextTraffic', 'false') == 'false'
          assert root.find('uses-sdk').attrib[android + 'minSdkVersion'] == '26'
          assert root.find('uses-sdk').attrib[android + 'targetSdkVersion'] == '36'
          PY
          sha256sum artifacts/android-test/duallane-test-signed.* > artifacts/android-test/SHA256SUMS

      - name: Install Android 15 emulator
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --force --name duallane-test \
            --package 'system-images;android-35;google_apis;x86_64' --device pixel_6

      - name: Install and cold-launch the self-contained APK
        timeout-minutes: 10
        run: |
          trap 'timeout 10 adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > artifacts/android-test/runtime-errors.txt || true; cp "$RUNNER_TEMP/emulator.log" artifacts/android-test/emulator.log || true' EXIT
          "$ANDROID_HOME/emulator/emulator" -avd duallane-test -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
          adb install artifacts/android-test/duallane-test-signed.apk
          adb logcat -c
          for launch in cold restart; do
            adb shell am force-stop com.timestarry.duallane
            adb shell am start -W -n com.timestarry.duallane/.MainActivity
            sleep 10
            adb shell pidof com.timestarry.duallane
            adb shell uiautomator dump /sdcard/duallane-ui.xml
            adb pull /sdcard/duallane-ui.xml "artifacts/android-test/$launch-ui.xml"
            adb exec-out screencap -p > "artifacts/android-test/$launch.png"
            python - "$launch" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(f'artifacts/android-test/{sys.argv[1]}-ui.xml').getroot()
          labels = {node.attrib.get(key, '') for node in root.iter() for key in ('text', 'content-desc')}
          assert 'DualLane' in labels, labels
          assert '服务地址' in labels, labels
          assert '使用 GitHub 登录' in labels, labels
          PY
          done
          adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > artifacts/android-test/runtime-errors.txt
          test ! -s artifacts/android-test/runtime-errors.txt || ! grep -E 'FATAL EXCEPTION|ReactNativeJS:.*(Error|Exception)' artifacts/android-test/runtime-errors.txt
          echo 'Test-signed APK/AAB built. Android 15 emulator installation, cold login-screen launch and process restart passed. No account login, background notifications or OTA acceptance was performed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duallane-android-test-signed-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/android-test/

      - name: Stop disposable emulator
        if: always()
        run: adb emu kill || true
