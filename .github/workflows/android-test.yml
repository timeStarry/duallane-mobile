name: android-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: test
      CI: '1'
      DUALLANE_APP_VERSION: '1.0.7'
      DUALLANE_ANDROID_VERSION_CODE: '10007'
      EXPO_PUBLIC_API_ORIGIN: ${{ vars.DUALLANE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require configured service origin
        run: |
          if [[ -z "$EXPO_PUBLIC_API_ORIGIN" ]]; then
            echo "EXPO_PUBLIC_API_ORIGIN=https://duallane.tsio.top" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android command-line tools
        run: |
          tools_dir="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -printf '%h\n' | sort -V | tail -n 1)"
          for tool in apkanalyzer sdkmanager avdmanager; do
            test -x "$tools_dir/$tool"
          done
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "DUALLANE_ANDROID_TOOLS=$tools_dir" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-user/avd" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and build mobile bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm sync:android
          pnpm build:icons

      - name: Generate disposable test keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/android-test.keystore" \
            -storepass android-test \
            -keypass android-test \
            -alias android-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=DualLane Test, O=DualLane, C=CN"

      - name: Compile native Android debug and release packages
        working-directory: android
        env:
          DUALLANE_ANDROID_KEYSTORE: ${{ runner.temp }}/android-test.keystore
          DUALLANE_ANDROID_STORE_PASSWORD: android-test
          DUALLANE_ANDROID_KEY_ALIAS: android-test
          DUALLANE_ANDROID_KEY_PASSWORD: android-test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            :app:validateSigningDebug :app:validateSigningRelease \
            :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Verify package manifest, signatures, and embedded config
        run: |
          mkdir -p artifacts/android-test
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/android-test/duallane-test-signed.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/android-test/duallane-test-signed.aab
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs artifacts/android-test/duallane-test-signed.apk > artifacts/android-test/apk-signature.txt
          jarsigner -J-Duser.language=en -verify -certs artifacts/android-test/duallane-test-signed.aab > artifacts/android-test/aab-signature.txt
          grep -F 'jar verified.' artifacts/android-test/aab-signature.txt
          "$DUALLANE_ANDROID_TOOLS/apkanalyzer" manifest print artifacts/android-test/duallane-test-signed.apk > artifacts/android-test/manifest.xml
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          import zipfile
          root = ET.parse('artifacts/android-test/manifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          assert root.attrib['package'] == 'com.timestarry.duallane'
          assert root.attrib[android + 'versionCode'] == os.environ['DUALLANE_ANDROID_VERSION_CODE']
          assert root.attrib[android + 'versionName'] == os.environ['DUALLANE_APP_VERSION']
          assert app.attrib[android + 'allowBackup'] == 'false'
          assert app.attrib.get(android + 'debuggable', 'false') == 'false'
          assert app.attrib.get(android + 'usesCleartextTraffic', 'false') == 'false'
          assert root.find('uses-sdk').attrib[android + 'minSdkVersion'] == '26'
          assert root.find('uses-sdk').attrib[android + 'targetSdkVersion'] == '36'
          with zipfile.ZipFile('artifacts/android-test/duallane-test-signed.apk') as apk:
              app_config = json.loads(apk.read('assets/app.config'))
          assert app_config['extra']['apiOrigin'] == os.environ['EXPO_PUBLIC_API_ORIGIN']
          with open('artifacts/android-test/app-config.json', 'w', encoding='utf-8') as output:
              json.dump(app_config, output, ensure_ascii=False, indent=2)
          PY
          sha256sum artifacts/android-test/duallane-test-signed.* > artifacts/android-test/SHA256SUMS

      - name: Boot Android 15 emulator and run cold/restart/dark launch smoke checks
        timeout-minutes: 15
        run: |
          mkdir -p "$ANDROID_AVD_HOME" artifacts/android-test
          sudo chmod 666 /dev/kvm
          yes | "$DUALLANE_ANDROID_TOOLS/sdkmanager" --licenses >/dev/null || true
          "$DUALLANE_ANDROID_TOOLS/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | "$DUALLANE_ANDROID_TOOLS/avdmanager" create avd --force --name duallane-test \
            --path "$ANDROID_AVD_HOME/duallane-test.avd" \
            --package 'system-images;android-35;google_apis;x86_64' --device pixel_6

          "$ANDROID_HOME/emulator/emulator" -avd duallane-test -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 \
            > artifacts/android-test/emulator.log 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 240))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat artifacts/android-test/emulator.log
              exit 1
            fi
            boot_completed="$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot_completed" == 1 ]]; then
              adb shell input keyevent 82
              break
            fi
            sleep 2
          done

          trap 'timeout 10 adb logcat -d -s AndroidRuntime:E > artifacts/android-test/runtime-errors.txt || true' EXIT
          adb install artifacts/android-test/duallane-test-signed.apk
          adb logcat -c
          adb shell cmd uimode night no
          for launch in cold restart dark; do
            if [[ "$launch" == dark ]]; then
              adb shell cmd uimode night yes
            fi
            adb shell am force-stop com.timestarry.duallane
            adb shell am start -W -n com.timestarry.duallane/.MainActivity
            sleep 5
            adb shell pidof com.timestarry.duallane
            python3 scripts/android-smoke-login.py "$launch"
            adb exec-out screencap -p > "artifacts/android-test/$launch.png"
          done
          adb logcat -d -s AndroidRuntime:E > artifacts/android-test/runtime-errors.txt
          test ! -s artifacts/android-test/runtime-errors.txt || ! grep -E 'FATAL EXCEPTION' artifacts/android-test/runtime-errors.txt

      - name: Preserve package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duallane-android-test-signed-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/android-test/

      - name: Stop disposable emulator
        if: always()
        run: adb emu kill || true
